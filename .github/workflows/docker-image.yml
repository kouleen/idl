name: GitHub Merge Trigger Webhook
on:
  push:
    branches: ["release"]

jobs:
  build:
    if: success()
    runs-on: ubuntu-latest
    steps:
      # 1.检出release分支源码（thrift原始文件）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 重要，要拉全分支引用
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Install Kitex
        run: go install github.com/cloudwego/kitex/tool/cmd/kitex@latest

      # 2.kitex生成kitex_gen
      - name: Generate kitex_gen SDK
        run: |
          rm -rf kitex_gen
          mkdir -p kitex_gen
          echo "==== current pwd ===="
          pwd
          echo "==== ls -la ===="
          ls -la
          
          find . -type f -name "*.thrift" | while read -r file; do
          echo "processing $file"
          kitex -module github.com/kouleen/idl "$file"
          done

      # 3.切换/创建 gen‑sdk 分支，把生成代码放这里
      - name: Commit SDK to gen‑sdk branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 如果分支不存在就创建，存在就切换
          if git show-ref --verify --quiet refs/heads/gen-sdk; then
            git checkout gen-sdk
          else
            git checkout -b gen-sdk
          fi
          
          # 从release分支拿最新thrift、go.mod，去掉go.sum（防止文件不存在报错）
          git checkout release -- *.thrift go.mod
          
          git add kitex_gen *.thrift go.mod
          
          # 判断kitex_gen是否真的发生变化，没有变化就直接退出，不生成commit
          if git diff --quiet --cached kitex_gen; then
            echo "kitex_gen无变更，跳过提交"
            exit 0
          fi
          
          git commit -m "chore(auto): update kitex_gen from release $GITHUB_SHA"
          git push origin gen-sdk --force-with-lease

      # 4.自动打版本tag（只在gen‑sdk分支操作）
      - name: Bump semantic version tag
        id: bump_tag
        run: |
          # 获取远程最新tag，没有则默认v0.0.0
          LATEST_TAG=$(git ls-remote --tags --sort="v:refname" origin | grep -o "v[0-9]*\.[0-9]*\.[0-9]*$" | tail -n1 || echo "v0.0.0")
          echo "latest tag: $LATEST_TAG"
          NEW_VERSION=$(echo $LATEST_TAG | awk -F. '{printf "v%d.%d.%d", $1+0, $2+0, $3+1}')
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          
          git tag "${NEW_VERSION}"
          git push origin "${NEW_VERSION}"

  notify:
    runs-on: ubuntu-latest
    needs: build   # 关键：等待build job完成才执行notify，串行：先构建SDK，后通知
    steps:
      - name: Call Custom Callback API
        id: call_webhook
        run: |
          RESP_BODY=$(curl -s -o response.txt -w "%{http_code}" \
            --connect-timeout 10 \
            --max-time 20 \
            -X GET "https://webapi.kouleen.cn/api/webhook/update?secret=${{ secrets.SECRET }}")
          HTTP_CODE=$RESP_BODY
          echo "HTTP_CODE=${HTTP_CODE}"
          echo "Response body:"
          cat response.txt
          
          if [[ "${HTTP_CODE}" -ne 200 ]]; then
            echo "❌ Webhook调用失败，http status: ${HTTP_CODE}"
            exit 1
          fi