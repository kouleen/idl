# 服务配置：新增服务只需在此追加，网关自动热加载
servers:
  user:
    service_name: user.service.rpc   # etcd 注册的服务名
    idl_path: user-center/user.thrift
    routes:
      - path: /api/user/captcha
        method: Captcha
        http_method: GET
      - path: /api/user/sendSmsMessage
        method: SmsCode
        http_method: GET
      - path: /api/user/register
        method: Register
        http_method: POST
      - path: /api/user/resetPwd
        method: ResetPwd
        http_method: POST
      - path: /api/user/login
        method: Login
        http_method: POST
      - path: /api/user/logout
        method: Logout
        http_method: POST
      - path: /api/user/queryUserHeaderPage
        method: QueryUserHeaderPage
        http_method: GET
      - path: /api/user/queryUserHeaderList
        method: QueryUserHeaderList
        http_method: GET
      - path: /api/user/queryUserHeaderInfo
        method: QueryUserHeaderInfo
        http_method: GET
      - path: /api/user/queryUserPositionPage
        method: QueryUserPositionPage
        http_method: GET
      - path: /api/user/saveUserPosition
        method: SaveUserPosition
        http_method: POST
      - path: /api/user/updateUserPosition
        method: UpdateUserPosition
        http_method: POST
      - path: /api/user/deleteUserPosition
        method: DeleteUserPosition
        http_method: POST
  system:
    service_name: system.service.rpc   # etcd 注册的服务名
    idl_path: system-center/system.thrift
    routes:
      - path: /api/system/querySystemDictHeaderPage
        method: QuerySystemDictHeaderPage
        http_method: GET
      - path: /api/system/querySystemDictHeaderList
        method: QuerySystemDictHeaderList
        http_method: GET
      - path: /api/system/createSystemDictHeader
        method: CreateSystemDictHeader
        http_method: POST
      - path: /api/system/updateSystemDictHeader
        method: UpdateSystemDictHeader
        http_method: POST
      - path: /api/system/deleteSystemDictHeader
        method: DeleteSystemDictHeader
        http_method: POST
      - path: /api/system/querySystemDictLinePage
        method: QuerySystemDictLinePage
        http_method: GET
      - path: /api/system/querySystemDictLineList
        method: QuerySystemDictLineList
        http_method: GET
      - path: /api/system/createSystemDictLine
        method: CreateSystemDictLine
        http_method: POST
      - path: /api/system/updateSystemDictLine
        method: UpdateSystemDictLine
        http_method: POST
      - path: /api/system/deleteSystemDictLine
        method: DeleteSystemDictLine
        http_method: POST
      - path: /api/system/querySystemInterfacePage
        method: QuerySystemInterfacePage
        http_method: GET
      - path: /api/system/querySystemInterfaceList
        method: QuerySystemInterfaceList
        http_method: GET
      - path: /api/system/cleanCacheSystemInterface
        method: CleanCacheSystemInterface
        http_method: GET
      - path: /api/system/saveSystemInterface
        method: SaveSystemInterface
        http_method: POST
      - path: /api/system/updateSystemInterface
        method: UpdateSystemInterface
        http_method: POST
      - path: /api/system/deleteSystemInterface
        method: DeleteSystemInterface
        http_method: POST


